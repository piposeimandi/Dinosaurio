<html lang="es">
<head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <title>Dinosaurio</title>
    <style>

* {
    padding: 0;
    margin: 0;
}



body {
            height: 100%;
            background: #584040;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0; /* Asegúrate de que no haya márgenes predeterminados */
        }

:root {
    --dino-size-desktop: 10vh;
    --dino-size-mobile: 12vh;
    --dino-frame-width: var(--dino-size-desktop); /* Default to desktop size */
}

.contenedor {
    width: 90%; /* Usa porcentajes para adaptar el ancho al tamaño de la pantalla */
    max-width: 900px; /* Establece un ancho máximo para evitar que crezca demasiado en pantallas grandes */
    height: 60vh; /* Altura responsiva */
    min-height: 250px; /* Altura mínima */
    max-height: 400px; /* Altura máxima */
    
    margin: 5vh auto; /* Margen superior/inferior responsivo */
    position: relative;
    background: linear-gradient(#b7d6c7, transparent) #ffe2d1;/*linear-gradient(#90ebff, white);*/
    transition: background-color 1s linear;
    overflow: hidden;
}

.mediodia {
    background-color: #ffdcf3;
}

.tarde {
    background-color: #ffadad;
}

.noche {
    background-color: #aca8c7;
}

.dino {
    /* width: 84px; height: 84px; */ /* Original dimensions */
    height: 15%; /* Responsive height relative to container */
    width: calc(84px / 84px * 15%); /* Maintain aspect ratio, assuming 15% height */
    /* Calculate width based on new height and original aspect ratio (84/84 = 1)
       If new height is 15% of container, and aspect ratio is 1, width should also be 15% of container's height.
       This needs to be dynamic if container height changes. Let's use a fixed aspect ratio approach.
       Let's set height to 10vh for simplicity and calculate width based on that.
    */
    height: var(--dino-frame-width); 
    width: var(--dino-frame-width); 


    position: absolute;
    /* bottom: 22px; */ /* Original bottom */
    bottom: 5%; /* Responsive bottom relative to container height */
    /* left: 42px; */ /* Original left */
    left: 5%; /* Responsive left relative to container width */
    z-index: 2;

    background: url(img/dino.png) repeat-x 0px 0px;
    /* background-size: 336px 84px; */ /* Original background size */
    background-size: calc(4 * var(--dino-frame-width)) var(--dino-frame-width); /* Scaled background size */
    background-position-x: 0px; /* Initial static frame */

}

.dino-corriendo {
    animation: animarDino 0.3s linear infinite; /* Use linear and explicit keyframes */
}
.dino-estrellado {
    /* background-position-x: -252px; */ /* Original. This is frame 4 (dino_width * 3) */
    background-position-x: calc(-3 * var(--dino-frame-width)); /* Scaled background position */
}

.suelo {
    width: 200%;
    /* height: 42px; */ /* Original height */
    height: 10%; /* Responsive height relative to container */

    position: absolute;
    bottom: 0;
    left: 0;

    background: url(img/suelo.png) repeat-x 0px 0px;
    /* background-size: 50% 42px; */ /* Original background size */
    /* New height is 10% of container. Original image height was 42px.
       So, background-size: 50% new_height;
    */
    background-size: 50% 100%; /* Make background image cover the full height of .suelo */

}

.cactus{
    /* width: 46px; height: 96px; */ /* Original dimensions */
    /* Let's scale based on container height, similar to dino */
    height: 20%; /* Example: 20% of container height */
    width: calc(46px / 96px * 20%); /* Maintain aspect ratio */
    /* width: 5vh; height: 10vh; */ /* Alternative using vh */


    position: absolute;
    /* bottom: 16px; */ /* Original bottom */
    bottom: 4%; /* Relative to container height, slightly above suelo */
    left: 600px; /* Will be handled by JS, but responsive units could be explored if JS wasn't setting it */
    z-index: 1;

    background: url(img/cactus1.png) no-repeat;
    background-size: contain; /* Scale background image to fit within element */
}
.cactus2{ /* This class is added to .cactus, so it inherits .cactus dimensions if not overridden */
    /* width: 98px; height: 66px; */ /* Original dimensions for type 2 cactus */
    /* If .cactus height is 20%, then for cactus2: */
    /* New width: (98/66) * new_height_of_cactus_element */
    /* This requires JS to adjust width based on which cactus type or use different classes */
    /* For now, let's assume JS handles the switch and we provide a base responsive size for .cactus */
    /* If .cactus2 is a modifier, its specific background image should also scale. */
    /* This might need more specific handling if aspect ratios differ significantly */
    width: calc(98px / 66px * 20%); /* Maintain aspect ratio for cactus2 type, assuming .cactus height is 20% */
    background: url(img/cactus2.png) no-repeat;
    background-size: contain; /* Scale background image */
}

.nube{
    /* width: 92px; height: 26px; */ /* Original dimensions */
    width: 10vw; /* Responsive width */
    height: calc(26px / 92px * 10vw); /* Maintain aspect ratio */

    position: absolute;
    z-index: 0;

    background: url(img/nube.png) no-repeat;
    background-size: contain; /* Scale background image */
}

.score{
    /* width: 100px; height: 30px; */ /* Original dimensions */
    position: absolute;
    top: 1vh; /* Responsive top */
    right: 2vw; /* Responsive right */
    z-index: 10;

    color: #d48871;
    font-family: Verdana;
    /* font-size: 30px; */ /* Original font size */
    font-size: 3vh; /* Responsive font size */
    font-weight: bold;
    text-align: right;
}

.game-over{
    display: none;
    position: absolute;
    width: 100%;
    text-align: center;
    color: #7e928b;
    /* font-size: 30px; */ /* Original font size */
    font-size: 5vh; /* Responsive font size */
    font-family: Verdana;
    font-weight: 700;
    top: 50%; /* Center vertically */
    transform: translateY(-50%); /* Adjust vertical centering */
}

    @keyframes animarDino{
        0% { background-position-x: calc(-1 * var(--dino-frame-width)); } /* Corriendo 1 */
        50% { background-position-x: calc(-2 * var(--dino-frame-width)); } /* Corriendo 2 */
        100% { background-position-x: calc(-1 * var(--dino-frame-width)); } /* Vuelve a Corriendo 1 */
    }

    /* Removed @keyframes animarDinoMobile as it's no longer needed */

    .qr {
            display: none;
            position: fixed;
            top: 15vh; /* Adjusted top */
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #d48871;
            font-family: Verdana;
            /* font-size: 30px; */ /* Original font size */
            font-size: 2.5vh; /* Responsive font size */
            font-weight: bold;
            z-index: 1000; /* Ajusta el índice z para asegurarte de que esté encima de otros elementos */
        }

        .qr img {
            height: 8vh; /* Adjusted from 5vw to be relative to viewport height */
        }
        
        /* Base styles for desktop (>= 992px) are above */

        /* Tablet (ej. min-width: 768px y max-width: 991px) */
        @media only screen and (min-width: 768px) and (max-width: 991px) {
            .contenedor {
                margin: 7vh auto; /* Slightly larger margin for tablets */
            }
            .score {
                font-size: 2.5vh;
            }
            .game-over {
                font-size: 4vh;
            }
            .qr {
                font-size: 2vh;
            }
            .qr img {
                height: 7vh;
            }
        }


        /* Móvil (ej. max-width: 767px) */
        /* This also covers the old max-width: 600px query */
        @media only screen and (max-width: 767px) {
            .contenedor {
                width: 100%; /* Ocupa el 100% del ancho en pantallas pequeñas */
                margin: 3vh auto; /* Smaller margin for mobile */
                min-height: 200px; /* Adjust min-height for smaller screens */
                max-height: 350px; /* Adjust max-height */
            }

            .contenedor {
                width: 100%; /* Ocupa el 100% del ancho en pantallas pequeñas */
                margin: 3vh auto; /* Smaller margin for mobile */
                min-height: 200px; /* Adjust min-height for smaller screens */
                max-height: 350px; /* Adjust max-height */
            }

            /* Redefine dino-frame-width for mobile */
            :root { /* This might not work as expected, media query should target actual properties or a class on body/container */
                 /* Better to set it on .dino or .container if :root doesn't update as expected */
            }
            /* Let's redefine it directly where it's used or on a parent that is specific enough */
             .dino { /* This will apply inside the media query */
                --dino-frame-width: var(--dino-size-mobile);
                /* Properties like width, height, background-size on .dino will automatically use this due to var() */
                /* The animation @keyframes animarDino will also pick up the changed --dino-frame-width */
                 bottom: 4%; /* Mobile specific adjustments if needed */
                 left: 3%;   /* Mobile specific adjustments if needed */
             }
            /* No need to redefine .dino-estrellado or .dino-corriendo animation here if animarDino uses the var */
            /* No need for animarDinoMobile keyframes anymore */

            .suelo {
                height: 12%; /* Adjust suelo height */
            }

            .cactus {
                height: 18%;
                width: calc(46px / 96px * 18%);
                bottom: 3.5%;
            }
            .cactus2 {
                width: calc(98px / 66px * 18%);
            }

            .nube {
                width: 15vw;
                height: calc(26px / 92px * 15vw);
            }

            .score {
                font-size: 3.5vh;
                top: 0.5vh;
                right: 1vw;
            }

            .game-over {
                font-size: 4.5vh;
            }
            
            .qr {
                font-size: 1.8vh;
                top: 10vh;
            }
            .qr img {
                height: 10vh;
            }
        }

    </style>
</head>
<body>

    <audio id="jumpSound">  <source src="audio/salto.mp3" type="audio/mpeg"> </audio>

   

            <div class="contenedor">
    
                <div class="suelo"></div>
                
                <div class="dino dino-corriendo"></div>
        
                <div class="score">0</div>
                
       

            </div>
        
            <div class="game-over">GAME OVER</div>
    
            
            <div class="  qr" > Jugalo en Android!  
              <br>  <img  src="img/qr.png" alt="Código QR para abrir la página desde Android">
            </div>
      
           
        

<script>

//****** GAME LOOP ********//

var time = new Date();
var deltaTime = 0;

if(document.readyState === "complete" || document.readyState === "interactive"){
    setTimeout(Init, 1);
}else{
    document.addEventListener("DOMContentLoaded", Init); 
}

function Init() {
    time = new Date();
    Start();
    Loop();
    
}

function Loop() {
    deltaTime = (new Date() - time) / 1000;
    time = new Date();
    Update();
    requestAnimationFrame(Loop);
}



//****** GAME LOGIC ********//

var sueloY; // Will be calculated in Start()
var velY = 0;
var impulso; // Will be set in Start()
var gravedad; // Will be set in Start()

var dinoPosX; // Will be calculated in Start()
var dinoPosY; // Will be calculated in Start()

var sueloX = 0;
var velEscenario; // Will be set in Start()
var gameVel = 1;
var score = 0;

var parado = false;
var saltando = false;

var tiempoHastaObstaculo = 2;
var tiempoObstaculoMin = 0.7;
var tiempoObstaculoMax = 1.8;
var obstaculoPosY; // Will be calculated in Start()
var obstaculos = [];

var tiempoHastaNube = 0.5;
var tiempoNubeMin = 0.7;
var tiempoNubeMax = 2.7;
var maxNubeY; // Will be calculated in Start()
var minNubeY; // Will be calculated in Start()
var nubes = [];
var velNube = 0.5;

var contenedor;
var dino;
var textoScore;
var suelo;
var gameOver;



function Start() {
    gameOver = document.querySelector(".game-over");
    suelo = document.querySelector(".suelo");
    contenedor = document.querySelector(".contenedor");
    textoScore = document.querySelector(".score");
    dino = document.querySelector(".dino");

    // Calculate dynamic values after DOM is ready and CSS applied
    sueloY = parseFloat(getComputedStyle(dino).bottom);
    dinoPosX = parseFloat(getComputedStyle(dino).left);
    dinoPosY = sueloY;
    
    // Assuming cactus bottom is 4% of container height as per CSS (.cactus { bottom: 4%; })
    // This is for the initial position, JS controls 'left' for movement
    obstaculoPosY = 0.04 * contenedor.clientHeight; 

    // Adjust physics parameters - these are experimental
    impulso = 700; // Original 900
    gravedad = 2000; // Original 2500
    
    // Adjust cloud generation Y coordinates
    minNubeY = contenedor.clientHeight * 0.25;
    maxNubeY = contenedor.clientHeight * 0.80;

    // Adjust scenario velocity
    velEscenario = contenedor.clientWidth / 3; // Original 1280/3

    document.addEventListener("keydown", HandleKeyDown);
    document.addEventListener("click", function() {  Saltar(); });
    
    // Ensure dino is correctly positioned at start, especially if ReiniciarJuego calls Start
    dino.style.bottom = dinoPosY + "px";
    dino.style.left = dinoPosX + "px";
}

function Update() {
    if(parado) return;
    
    MoverDinosaurio();
    MoverSuelo();
    DecidirCrearObstaculos();
    DecidirCrearNubes();
    MoverObstaculos();
    MoverNubes();
    DetectarColision();

    velY -= gravedad * deltaTime;
}

function HandleKeyDown(ev){
    if(ev.keyCode == 32 ){
        Saltar();
    }
}


function Saltar() {
    if (parado) {
        ReiniciarJuego();
    } else if (dinoPosY === sueloY) {
        console.log("Saltar: quitando dino-corriendo");
        saltando = true;
        velY = impulso;
        dino.classList.remove("dino-corriendo"); // Dino will show frame 0 (static)
        // No specific "dino-saltando" class/style is applied, so it uses the base .dino style (frame 0)

        // Reproduce el sonido de salto
        var jumpSound = document.getElementById("jumpSound");
        if (jumpSound) {
            jumpSound.currentTime = 0;
            jumpSound.play();
        }
    }
}


function MoverDinosaurio() {
    dinoPosY += velY * deltaTime;
    if(dinoPosY < sueloY){
        
        TocarSuelo();
    }
    dino.style.bottom = dinoPosY+"px";
}

function TocarSuelo() {
    dinoPosY = sueloY;
    velY = 0;
    if(saltando){
        console.log("TocarSuelo: añadiendo dino-corriendo");
        dino.classList.add("dino-corriendo");
    }
    saltando = false;
}

function MoverSuelo() {
    if (!suelo) {
        console.error("Elemento suelo no encontrado.");
        return;
    }
    sueloX += CalcularDesplazamiento();
    suelo.style.left = -(sueloX % contenedor.clientWidth) + "px";
}



function CalcularDesplazamiento() {
    return velEscenario * deltaTime * gameVel;
}

function Estrellarse() {
    dino.classList.remove("dino-corriendo");
    dino.classList.add("dino-estrellado");
    parado = true;
}

function DecidirCrearObstaculos() {
    tiempoHastaObstaculo -= deltaTime;
    if(tiempoHastaObstaculo <= 0) {
        CrearObstaculo();
    }
}

function DecidirCrearNubes() {
    tiempoHastaNube -= deltaTime;
    if(tiempoHastaNube <= 0) {
        CrearNube();
    }
}

function CrearObstaculo() {
    var obstaculo = document.createElement("div");
    contenedor.appendChild(obstaculo);
    obstaculo.classList.add("cactus");
    if(Math.random() > 0.5) obstaculo.classList.add("cactus2");
    obstaculo.posX = contenedor.clientWidth;
    obstaculo.style.left = contenedor.clientWidth+"px";

    obstaculos.push(obstaculo);
    tiempoHastaObstaculo = tiempoObstaculoMin + Math.random() * (tiempoObstaculoMax-tiempoObstaculoMin) / gameVel;
}

function CrearNube() {
    var nube = document.createElement("div");
    contenedor.appendChild(nube);
    nube.classList.add("nube");
    nube.posX = contenedor.clientWidth;
    nube.style.left = contenedor.clientWidth+"px";
    nube.style.bottom = minNubeY + Math.random() * (maxNubeY-minNubeY)+"px";
    
    nubes.push(nube);
    tiempoHastaNube = tiempoNubeMin + Math.random() * (tiempoNubeMax-tiempoNubeMin) / gameVel;
}

function MoverObstaculos() {
    for (var i = obstaculos.length - 1; i >= 0; i--) {
        if(obstaculos[i].posX < -obstaculos[i].clientWidth) {
            obstaculos[i].parentNode.removeChild(obstaculos[i]);
            obstaculos.splice(i, 1);
            GanarPuntos();
        }else{
            obstaculos[i].posX -= CalcularDesplazamiento();
            obstaculos[i].style.left = obstaculos[i].posX+"px";
        }
    }
}

function MoverNubes() {
    for (var i = nubes.length - 1; i >= 0; i--) {
        if(nubes[i].posX < -nubes[i].clientWidth) {
            nubes[i].parentNode.removeChild(nubes[i]);
            nubes.splice(i, 1);
        }else{
            nubes[i].posX -= CalcularDesplazamiento() * velNube;
            nubes[i].style.left = nubes[i].posX+"px";
        }
    }
}


// Definir un array de clases de tiempo
const clasesTiempo = ["mediodia", "tarde", "noche"];

function GanarPuntos() {
    score++;
    console.log("Puntos: " + score);
    textoScore.innerText = score;

    if (score % 10 === 0) {
        console.log("Aumentando velocidad");
        gameVel += 0.1;
        cambiarClaseTiempo();
        suelo.style.animationDuration = (3 / gameVel) + "s";
    }

    
}

function aumentarVelocidad() {
    gameVel += 0.1;
}

function cambiarClaseTiempo() {
    console.log("Cambiando clase de tiempo");

    // Calcular el índice actual en el array de clases de tiempo
    const indice = Math.floor((gameVel - 1.1) * 10);

    // Obtener la clase de tiempo correspondiente
    const claseTiempo = clasesTiempo[indice % clasesTiempo.length];

    // Aplicar la clase de tiempo solo si ha cambiado
    if (contenedor.classList.contains(claseTiempo)) {
        console.log("La clase de tiempo no ha cambiado:", claseTiempo);
        return;
    }

    // Eliminar todas las clases de tiempo existentes y aplicar la nueva clase
    contenedor.classList.remove(...clasesTiempo);
    contenedor.classList.add(claseTiempo);

    console.log("Nueva clase de tiempo aplicada:", claseTiempo);
}




function GameOver() {
    console.log("Fin del juego");
    Estrellarse();
    gameOver.style.display = "block";
}

function DetectarColision() {
    for (var i = 0; i < obstaculos.length; i++) {
        if(obstaculos[i].posX > dinoPosX + dino.clientWidth) {
            //EVADE
            break; //al estar en orden, no puede chocar con más
        }else{
            // Adjusted padding values for IsCollision. Original: 10, 30, 15, 20
            // These are experimental and might need further tuning.
            if(IsCollision(dino, obstaculos[i], 5, 10, 5, 5)) {
                GameOver();
            }
        }
    }
}

function IsCollision(a, b, paddingTop, paddingRight, paddingBottom, paddingLeft) {
    var aRect = a.getBoundingClientRect();
    var bRect = b.getBoundingClientRect();

    return !(
        ((aRect.top + aRect.height - paddingBottom) < (bRect.top)) ||
        (aRect.top + paddingTop > (bRect.top + bRect.height)) ||
        ((aRect.left + aRect.width - paddingRight) < bRect.left) ||
        (aRect.left + paddingLeft > (bRect.left + bRect.width))
    );
}


function ReiniciarJuego() {
    // Restablece todas las variables de juego
    score = 0;
    dinoPosY = sueloY;
    velY = 0;
    sueloX = 0;
    parado = false;
    saltando = false;

    // Elimina el mensaje de "Game Over"
    gameOver.style.display = "none";

    // Elimina todos los obstáculos y nubes existentes
    obstaculos.forEach(function(obstaculo) {
        obstaculo.parentNode.removeChild(obstaculo);
    });
    obstaculos = [];

    nubes.forEach(function(nube) {
        nube.parentNode.removeChild(nube);
    });
    nubes = [];

    // Reinicia la velocidad del juego
    gameVel = 1;
    suelo.style.animationDuration = "3s"; // Ajusta la duración de la animación del suelo

    // Reinicia el texto del marcador
    textoScore.innerText = "0";

    // Llama a la función Start para configurar el juego nuevamente, 
    // which will re-calculate positions based on current container size.
    Start();
}



        // Mostrar el título solo si el ancho de la ventana es mayor que 600px
        if (window.innerWidth > 600) {
            document.querySelector('.qr').style.display = 'block';
        }

              // Verificar si es un dispositivo móvil y forzar la orientación landscape
              if (window.innerWidth < 600 && window.innerHeight > window.innerWidth) {
            alert("Gira tu dispositivo para una mejor experiencia.");
        }


</script>
</body>
